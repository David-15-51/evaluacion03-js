<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClimaTec - ViajaPerU</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .buscador { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input { flex: 1; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 0.5rem 1rem; background: #2563eb; color: #fff; border: none;
             border-radius: 4px; cursor: pointer; }
    button:disabled { background: #93c5fd; cursor: not-allowed; }
    #estado { color: #6b7280; min-height: 1.5rem; }
    #resultado { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; display: none; }
    #resultado h2 { margin: 0 0 0.5rem; }
    .comparacion { margin-top: 2rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #d1d5db; padding: 0.4rem 0.6rem; text-align: left; }
    th { background: #f3f4f6; }
  </style>
</head>
<body>
  <h1>ClimaTec - ViajaPerU</h1>

  <div class="buscador">
    <input id="ciudad-input" type="text" placeholder="Nombre de ciudad (ej: Cusco)">
    <button id="btn-buscar">Buscar</button>
  </div>

  <p id="estado"></p>

  <div id="resultado">
    <h2 id="nombre-ciudad"></h2>
    <p id="region"></p>
    <p id="temperatura"></p>
    <p id="viento"></p>
  </div>

  <div class="comparacion">
    <h2>Comparacion secuencial vs. paralela</h2>
    <button id="btn-comparar">Medir Lima, Cusco y Arequipa</button>
    <div id="tabla-tiempos"></div>
  </div>

  <script type="module" src="clima.js"></script>
</body>
</html>
