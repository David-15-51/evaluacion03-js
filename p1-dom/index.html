<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CafeTec - Gestor de Pedidos</title>
  <style>
    body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input { padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; border-radius: 4px; border: none; }
    button[type="submit"] { background: #2563eb; color: #fff; }
    #mensaje { color: #dc2626; min-height: 1.2rem; margin-bottom: 0.5rem; }
    select { padding: 0.4rem; margin-bottom: 1rem; }
    ul { list-style: none; padding: 0; }
    li {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem; border-bottom: 1px solid #e5e7eb;
    }
    li.entregado { opacity: 0.5; text-decoration: line-through; }
    .btn-entregar { background: #16a34a; color: #fff; }
    .btn-eliminar { background: #dc2626; color: #fff; }
    #total { font-weight: bold; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>CafeTec - Pedidos</h1>

  <!-- Estructura HTML requerida por el enunciado; ids no se modifican -->
  <form id="form-pedido">
    <input id="producto" placeholder="Producto">
    <input id="precio" type="number" step="0.10" placeholder="Precio S/">
    <input id="cantidad" type="number" min="0" placeholder="Cantidad">
    <button type="submit">Agregar</button>
  </form>

  <p id="mensaje"></p>

  <select id="filtro">
    <option value="todos">Todos</option>
    <option value="pendiente">Pendientes</option>
    <option value="entregado">Entregados</option>
  </select>

  <ul id="lista-pedidos"></ul>
  <p id="total"></p>

  <!-- Cargado como modulo para poder usar import/export en p2 -->
  <script type="module" src="main.js"></script>
</body>
</html>
